<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hablemos — iatelier</title>
  <meta name="description" content="Escríbenos para saber más sobre cursos, talleres o aumentos a medida con inteligencia artificial."/>
  <link rel="canonical" href="https://iatelier.org/contacto/"/>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png"/>

  <!-- Open Graph -->
  <meta property="og:title" content="Hablemos — iatelier"/>
  <meta property="og:description" content="Escríbenos para saber más sobre cursos, talleres o aumentos a medida con inteligencia artificial."/>
  <meta property="og:image" content="https://iatelier.org/img/og-image.png"/>
  <meta property="og:url" content="https://iatelier.org/contacto/"/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="iatelier — Ideas Aumentadas"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/styles.css"/>

  <style>
    body {
      font-family: var(--font-body);
      color: var(--tinta);
      background: var(--marfil);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ========================================
       MAIN — CONTACT
       ======================================== */
    .contacto {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      padding: calc(var(--space-2xl) + 60px) clamp(1.5rem, 5vw, 4rem) var(--space-xl);
    }

    .contacto h1 {
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      font-weight: 700;
      margin-bottom: var(--space-sm);
    }

    .contacto .subtitle {
      font-size: clamp(1rem, 1.3vw, 1.1rem);
      color: var(--arena);
      margin-bottom: var(--space-md);
    }

    .form-embed {
      max-width: 600px;
      width: 100%;
    }

    .contact-alt {
      margin-top: var(--space-xl);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--arena);
      letter-spacing: 0.04em;
    }
    .contact-alt a {
      color: var(--arena-light);
      border-bottom: 1px solid var(--arena);
      transition: color 0.2s;
    }
    .contact-alt a:hover {
      color: var(--tinta);
    }

    /* ---- Formulario de contacto HTML ---- */
    .contacto-form { display: flex; flex-direction: column; gap: 1rem; text-align: left; }
    .contacto-field { display: flex; flex-direction: column; gap: 5px; }
    .contacto-label {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 0.88rem;
      color: var(--tinta);
    }
    .contacto-input,
    .contacto-textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--arena-light);
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--tinta);
      background: #fff;
      box-sizing: border-box;
      -webkit-appearance: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .contacto-input:focus,
    .contacto-textarea:focus {
      outline: none;
      border-color: var(--cadmio);
      box-shadow: 0 0 0 3px rgba(217,43,31,0.08);
    }
    .contacto-input::placeholder,
    .contacto-textarea::placeholder { color: var(--arena-light); }
    .contacto-textarea { resize: vertical; min-height: 130px; }
    .contacto-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 500px) { .contacto-row { grid-template-columns: 1fr; } }
    .contacto-submit {
      display: inline-flex;
      align-items: center;
      padding: 12px 28px;
      background: var(--cadmio);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.15s;
      align-self: flex-start;
    }
    .contacto-submit:hover:not(:disabled) { opacity: 0.88; }
    .contacto-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .contacto-ok { text-align: center; padding: var(--space-lg) 0; color: var(--arena); display: none; }
    .contacto-ok strong { display: block; font-size: 1.05rem; color: var(--tinta); margin-bottom: 0.4rem; }
    .contacto-error {
      font-size: 0.82rem;
      color: var(--cadmio);
      padding: 8px 12px;
      border: 1.5px solid rgba(217,43,31,0.3);
      border-radius: 6px;
      background: rgba(217,43,31,0.05);
      display: none;
    }
    .contacto-error.visible { display: block; }

    /* ========================================
       FOOTER
       ======================================== */
    .footer {
      background: var(--tinta);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-lg) clamp(1.5rem, 5vw, 3rem);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .footer-logo .iat-logo {
      height: 18px;
      width: auto;
      color: var(--arena);
    }

    .footer-copy {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--arena);
    }
  </style>

  <!-- Cloudflare Web Analytics -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "91cf4721ddf94b1cb461c2d8a7258139"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>

<body>

  <!-- Nav -->
  <nav class="site-nav">
    <a href="/" class="nav-logo" aria-label="iatelier">
      <span class="iat-logo" aria-hidden="true"></span>
    </a>
    <button class="nav-hamburger" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay"></div>
    <div class="nav-links">
      <a href="/" class="nav-link">Inicio</a>
      <a href="/cursos/" class="nav-link">Cursos</a>
      <div class="nav-dropdown">
        <button class="nav-dropdown-trigger">Servicios</button>
        <div class="nav-dropdown-menu">
          <a href="/servicios/profesionales/">Para profesionales</a>
          <a href="/servicios/equipos/">Para equipos</a>
          <a href="/servicios/iniciativas/">Para iniciativas</a>
        </div>
      </div>
      <a href="/historia/" class="nav-link">Historia</a>
      <a href="/contacto/" class="nav-cta">Hablemos</a>
    </div>
  </nav>


  <!-- Main content -->
  <main class="contacto">
    <h1>Hablemos</h1>
    <p class="subtitle">Puedes contactarnos por este formulario o escribir directamente a <a href="mailto:info@iatelier.org" style="color: var(--cadmio); border-bottom: 1px solid var(--cadmio);">info@iatelier.org</a></p>

    <div class="form-embed">
      <form class="contacto-form" id="contacto-form" novalidate>
        <div class="contacto-row">
          <div class="contacto-field">
            <label class="contacto-label" for="c-nombre">Nombre(s)</label>
            <input type="text" id="c-nombre" name="entry.352861446" class="contacto-input" required/>
          </div>
          <div class="contacto-field">
            <label class="contacto-label" for="c-apellidos">Apellidos</label>
            <input type="text" id="c-apellidos" name="entry.1642367675" class="contacto-input" required/>
          </div>
        </div>
        <div class="contacto-field">
          <label class="contacto-label" for="c-email">Correo electrónico</label>
          <input type="email" id="c-email" name="entry.1843899023" class="contacto-input" required placeholder="tu@correo.com"/>
        </div>
        <div class="contacto-field">
          <label class="contacto-label" for="c-mensaje">Mensaje</label>
          <textarea id="c-mensaje" name="entry.1971625920" class="contacto-textarea" required placeholder="¿En qué puedo ayudarte?"></textarea>
        </div>
        <div class="contacto-error" id="contacto-error" role="alert"></div>
        <button type="submit" class="contacto-submit" id="contacto-submit">Enviar →</button>
      </form>
      <div class="contacto-ok" id="contacto-ok">
        <strong>¡Mensaje enviado!</strong>
        <p>Respondo en menos de 48 horas.</p>
      </div>
    </div>

  </main>


  <!-- Footer -->
  <footer class="footer">
    <div class="footer-logo">
      <span class="iat-logo" role="img" aria-label="iatelier"></span>
    </div>
    <span class="footer-copy">&copy; 2026 iatelier — Ideas Aumentadas</span>
  </footer>

  <script>
    // === Mobile hamburger menu ===
    const hamburger = document.querySelector('.nav-hamburger');
    const navLinks = document.querySelector('.nav-links');
    const navOverlay = document.querySelector('.nav-overlay');

    function toggleMenu() {
      hamburger.classList.toggle('open');
      navLinks.classList.toggle('open');
      navOverlay.classList.toggle('open');
      document.body.style.overflow = navLinks.classList.contains('open') ? 'hidden' : '';
    }

    hamburger.addEventListener('click', toggleMenu);
    navOverlay.addEventListener('click', toggleMenu);

    // Close menu when clicking a link
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        if (navLinks.classList.contains('open')) toggleMenu();
      });
    });

    // === Dropdown: click en touch, hover en desktop ===
    const dropdowns = document.querySelectorAll('.nav-dropdown');

    dropdowns.forEach((dd) => {
      const trigger = dd.querySelector('.nav-dropdown-trigger');

      trigger.addEventListener('click', (e) => {
        const isTouch = window.matchMedia('(hover: none)').matches;
        if (!isTouch) return;

        e.stopPropagation();
        const isOpen = dd.classList.contains('open');
        dropdowns.forEach((d) => d.classList.remove('open'));
        if (!isOpen) dd.classList.add('open');
      });
    });

    document.addEventListener('click', () => {
      dropdowns.forEach((d) => d.classList.remove('open'));
    });

    // Contacto form
    (function() {
      const CONTACTO_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfMXT8RrIuqoyQVDy7p4D72xBuINtkjH5zF8aIy1Q5ZfwN7HA/formResponse';
      const form  = document.getElementById('contacto-form');
      const ok    = document.getElementById('contacto-ok');
      const btn   = document.getElementById('contacto-submit');
      const errEl = document.getElementById('contacto-error');
      if (!form) return;

      function showErr(msg) { errEl.textContent = msg; errEl.classList.add('visible'); }
      function hideErr()    { errEl.classList.remove('visible'); }

      form.addEventListener('submit', async e => {
        e.preventDefault();
        hideErr();
        for (const f of form.querySelectorAll('[required]')) {
          if (!f.value.trim()) { f.focus(); showErr('Por favor completa todos los campos.'); return; }
        }
        const email = form.querySelector('[type="email"]').value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          form.querySelector('[type="email"]').focus();
          showErr('Verifica que el correo sea válido.'); return;
        }
        btn.disabled = true;
        btn.textContent = 'Enviando…';
        try {
          await fetch(CONTACTO_URL, {
            method: 'POST', mode: 'no-cors',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams(new FormData(form)).toString()
          });
        } catch(_) {}
        form.style.display = 'none';
        ok.style.display = 'block';
      });
    })();
  </script>

</body>
</html>
