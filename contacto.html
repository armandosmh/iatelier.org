  <style>
    /* ========================================
       @font-face — Maax (local)
       ======================================== */
    @font-face {
      font-family: 'Maax';
      src: url('fonts/Maax-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Maax';
      src: url('fonts/Maax-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Maax';
      src: url('fonts/Maax-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Maax';
      src: url('fonts/Maax-Black.otf') format('opentype');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Maax';
      src: url('fonts/Maax-Light.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Maax';
      src: url('fonts/Maax-Italic.otf') format('opentype');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    /* ========================================
       DESIGN TOKENS
       ======================================== */
    :root {
      --cadmio:      #D92B1F;
      --azul:        #3D5A6E;
      --marfil:      #F4F0EB;
      --tinta:       #1C1C1E;
      --arena:       #8C8070;
      --arena-light: #C4B9A8;
      --pizarra:     #1E2420;

      --font-display: 'Maax', 'Inter', sans-serif;
      --font-body:    'Inter', sans-serif;
      --font-mono:    'DM Mono', monospace;

      --space-xs:  0.25rem;
      --space-sm:  0.5rem;
      --space-md:  1rem;
      --space-lg:  2rem;
      --space-xl:  4rem;
      --space-2xl: 6rem;
      --space-3xl: 10rem;
    }

    /* ========================================
       RESET & BASE
       ======================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-body);
      color: var(--tinta);
      background: var(--marfil);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3, .display-font {
      font-family: var(--font-display);
      font-feature-settings: "ss02" 1;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    a { color: inherit; text-decoration: none; }

    ::selection {
      background: var(--cadmio);
      color: var(--marfil);
    }

    /* ========================================
       NAV
       ======================================== */
    .site-nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem clamp(1.5rem, 5vw, 3rem);
      background: rgba(244, 240, 235, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .nav-logo svg {
      height: 22px;
      width: auto;
      color: var(--tinta);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .nav-link {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--tinta);
      transition: color 0.3s ease;
    }
    .nav-link:hover {
      color: var(--cadmio);
    }

    /* Dropdown */
    .nav-dropdown {
      position: relative;
    }
    .nav-dropdown-trigger {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--tinta);
      transition: color 0.3s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: none;
      border: none;
      padding: 0;
    }
    .nav-dropdown:hover .nav-dropdown-trigger,
    .nav-dropdown-trigger:hover {
      color: var(--cadmio);
    }
    .nav-dropdown-trigger::after {
      content: '▾';
      font-size: 0.6rem;
      transition: transform 0.2s ease;
    }
    .nav-dropdown:hover .nav-dropdown-trigger::after {
      transform: rotate(180deg);
    }
    .nav-dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      min-width: 220px;
      background: rgba(28, 28, 30, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(244, 240, 235, 0.1);
      padding: 0.75rem 0 0.5rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .nav-dropdown:hover .nav-dropdown-menu,
    .nav-dropdown.open .nav-dropdown-menu {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .nav-dropdown:hover .nav-dropdown-trigger::after,
    .nav-dropdown.open .nav-dropdown-trigger::after {
      transform: rotate(180deg);
    }
    .nav-dropdown-menu a {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--marfil);
      padding: 0.65rem 1.25rem;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-dropdown-menu a:hover {
      background: rgba(217, 43, 31, 0.12);
      color: var(--cadmio);
    }

    .nav-cta {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--tinta);
      padding: 0.55rem 1.4rem;
      border: 1.5px solid var(--tinta);
      transition: all 0.3s ease;
    }
    .nav-cta:hover {
      background: var(--cadmio);
      color: var(--marfil);
      border-color: var(--cadmio);
    }

    /* ========================================
       MAIN — CONTACT
       ======================================== */
    .contacto {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      padding: calc(var(--space-2xl) + 60px) clamp(1.5rem, 5vw, 4rem) var(--space-xl);
    }

    .contacto h1 {
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      font-weight: 700;
      margin-bottom: var(--space-sm);
    }

    .contacto .subtitle {
      font-size: clamp(1rem, 1.3vw, 1.1rem);
      color: var(--arena);
      margin-bottom: var(--space-md);
    }

    .tally-embed {
      max-width: 600px;
      width: 100%;
    }

    .contact-alt {
      margin-top: var(--space-xl);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--arena);
      letter-spacing: 0.04em;
    }
    .contact-alt a {
      color: var(--arena-light);
      border-bottom: 1px solid var(--arena);
      transition: color 0.2s;
    }
    .contact-alt a:hover {
      color: var(--tinta);
    }

    /* ========================================
       FOOTER
       ======================================== */
    .footer {
      background: var(--tinta);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-lg) clamp(1.5rem, 5vw, 3rem);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .footer-logo svg {
      height: 18px;
      width: auto;
      color: var(--arena);
    }

    .footer-copy {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--arena);
    }
  </style>
</head>

  <script>
    // === Dropdown: click en touch, hover en desktop ===
    const dropdowns = document.querySelectorAll('.nav-dropdown');

    dropdowns.forEach((dd) => {
      const trigger = dd.querySelector('.nav-dropdown-trigger');

      trigger.addEventListener('click', (e) => {
        const isTouch = window.matchMedia('(hover: none)').matches;
        if (!isTouch) return;

        e.stopPropagation();
        const isOpen = dd.classList.contains('open');
        dropdowns.forEach((d) => d.classList.remove('open'));
        if (!isOpen) dd.classList.add('open');
      });
    });

    document.addEventListener('click', () => {
      dropdowns.forEach((d) => d.classList.remove('open'));
    });
  </script>
